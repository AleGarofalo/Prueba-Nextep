services:
  db:
    image: postgres:15-alpine
    # Compose reads these values from the root .env file.
    environment:
      POSTGRES_DB: ${DB_NAME:-${POSTGRES_DB:-}}
      POSTGRES_USER: ${DB_USER:-${POSTGRES_USER:-}}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-${POSTGRES_PASSWORD:-}}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ./bookstore-inventory-api
    command:
      - sh
      - -c
      - python manage.py migrate --noinput && exec python manage.py runserver 0.0.0.0:8000
    env_file:
      - .env
    volumes:
      - ./bookstore-inventory-api:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Vite proxies browser API requests to Django on the Compose network.
  frontend:
    image: node:24-alpine
    working_dir: /app
    environment:
      VITE_API_URL: ${VITE_API_URL:-/api}
      API_PROXY_TARGET: http://backend:8000
      CHOKIDAR_USEPOLLING: "true"
    command: ["sh", "-c", "npm ci && exec npm run dev -- --host 0.0.0.0 --port 5173"]
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_node_modules:
